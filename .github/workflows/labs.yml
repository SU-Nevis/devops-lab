name: Verify labs

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.lab }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        lab:
          - example-static-page
          - lab-template
          - terraform-docker-lab
    defaults:
      run:
        working-directory: ${{ matrix.lab }}
    steps:
      # actions/checkout v4.2.2; the immutable SHA prevents tag retargeting.
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Prepare local environment
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          fi

      # hashicorp/setup-terraform v4.0.1; the immutable SHA prevents tag retargeting.
      - name: Set up Terraform
        if: matrix.lab == 'terraform-docker-lab'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      - name: Show Terraform version
        if: matrix.lab == 'terraform-docker-lab'
        run: terraform version

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Start lab
        run: make up

      - name: Verify lab
        run: make verify

      - name: Tear down lab and prove resources are absent
        if: always()
        run: make down
